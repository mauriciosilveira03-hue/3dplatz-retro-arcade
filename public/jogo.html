
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D PLATZ ARCADE</title>

<style>
body {
  margin: 0;
  background: #080d0a;
  color: white;
  font-family: Arial;
  text-align: center;
}
h1 { color: #00ff66; }
#game {
  width: 100%;
  height: 65vh;
  min-height: 350px;
  background: black;
}
</style>
</head>

<body>
<h1>3D PLATZ</h1>
<h2>RETRO ARCADE</h2>
<p id="status">Carregando seu jogo...</p>
<div id="game"></div>

<script>
const jogos = {
  nfc001: {
    nome: "Pokemon Red",
    arquivo: "/games/Pokemon.gba"
  }
};

const parametros = new URLSearchParams(location.search);
const codigo = parametros.get("game") || "nfc001";
const jogo = jogos[codigo];

if (!jogo) {
  document.getElementById("status").textContent =
    "Chaveiro não encontrado.";
} else {
  document.getElementById("status").textContent =
    "Carregando " + jogo.nome + "...";

  window.EJS_player = "#game";
  window.EJS_core = "gba";
  window.EJS_gameUrl = jogo.arquivo;
  window.EJS_gameName = jogo.nome;
  window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_color = "#00ff66";
  window.EJS_startOnLoaded = true;

  const script = document.createElement("script");
  script.src = window.EJS_pathtodata + "loader.js";

  script.onerror = function() {
    document.getElementById("status").textContent =
      "Erro ao carregar o emulador.";
  };

  document.body.appendChild(script);
}
</script>
</body>
</html>
