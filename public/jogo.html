
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D PLATZ ARCADE</title>

<style>
body {
  margin: 0;
  background: #080d0a;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #00ff66; }
#game {
  width: 100%;
  height: 60vh;
  min-height: 350px;
  background: #000;
}
.painel { padding: 15px; }
input { margin: 20px; max-width: 90%; }
#status { color: #00ff66; }
</style>
</head>

<body>
<div class="painel">
  <h1>3D PLATZ</h1>
  <h2>RETRO ARCADE</h2>
  <p>Escolha seu jogo GBA:</p>
  <input type="file" id="arquivo" accept=".gba">
  <p id="status">Aguardando jogo...</p>
</div>

<div id="game"></div>

<script>
const input = document.getElementById("arquivo");
const status = document.getElementById("status");

input.addEventListener("change", function() {
  const rom = this.files[0];
  if (!rom) return;

  if (!rom.name.toLowerCase().endsWith(".gba")) {
    status.textContent = "Selecione um arquivo GBA.";
    return;
  }

  status.textContent = "Preparando emulador...";

  const url = URL.createObjectURL(rom);

  window.EJS_player = "#game";
  window.EJS_core = "gba";
  window.EJS_gameUrl = url;
  window.EJS_gameName = rom.name;
  window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_color = "#00ff66";
  window.EJS_startOnLoaded = true;

  const script = document.createElement("script");
  script.src = window.EJS_pathtodata + "loader.js";

  script.onload = function() {
    status.textContent = "Carregador iniciado. Aguarde o jogo...";
  };

  script.onerror = function() {
    status.textContent = "Erro ao carregar o emulador.";
  };

  document.body.appendChild(script);
});
</script>
</body>
</html>
